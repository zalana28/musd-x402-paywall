<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coin" x1="24" y1="16" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9A0"/>
      <stop offset="0.45" stop-color="#F7931A"/>
      <stop offset="1" stop-color="#FF5F0A"/>
    </linearGradient>
    <linearGradient id="shine" x1="40" y1="20" x2="88" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- coin body -->
  <circle cx="64" cy="64" r="46" fill="url(#coin)"/>
  <circle cx="64" cy="64" r="46" stroke="#FFE9C4" stroke-opacity="0.35" stroke-width="2"/>
  <!-- top shine -->
  <path d="M64 18 A46 46 0 0 1 106 62 A46 46 0 0 0 64 26 A46 46 0 0 1 22 62 A46 46 0 0 1 64 18 Z" fill="url(#shine)"/>

  <!-- Bitcoin ₿ -->
  <text x="64" y="84" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" fill="#1A0F02">₿</text>

  <!-- paywall bars: horizontal lock stripes over the coin's lower-right -->
  <g stroke="#1A0F02" stroke-width="7" stroke-linecap="round">
    <line x1="76" y1="46" x2="112" y2="46"/>
    <line x1="84" y1="62" x2="118" y2="62"/>
    <line x1="76" y1="78" x2="108" y2="78"/>
  </g>
  <!-- bar tips glow -->
  <g fill="#F7931A">
    <circle cx="112" cy="46" r="5.5"/>
    <circle cx="118" cy="62" r="5.5"/>
    <circle cx="108" cy="78" r="5.5"/>
  </g>
</svg>
