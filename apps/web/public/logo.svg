<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coin" x1="24" y1="16" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9A0"/>
      <stop offset="0.45" stop-color="#F7931A"/>
      <stop offset="1" stop-color="#FF5F0A"/>
    </linearGradient>
    <linearGradient id="shine" x1="40" y1="20" x2="88" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- coin body -->
  <circle cx="64" cy="64" r="50" fill="url(#coin)"/>
  <circle cx="64" cy="64" r="50" stroke="#FFE9C4" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M64 14 A50 50 0 0 1 112 60 A50 50 0 0 0 64 22 A50 50 0 0 1 16 60 A50 50 0 0 1 64 14 Z" fill="url(#shine)"/>

  <!-- bold P -->
  <text x="64" y="90" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF">P</text>

  <!-- metered bars under the P -->
  <g stroke="#1A0F02" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="46" y1="98" x2="64" y2="98"/>
    <line x1="70" y1="98" x2="82" y2="98"/>
    <line x1="88" y1="98" x2="94" y2="98"/>
  </g>
  <circle cx="94" cy="98" r="4" fill="#1A0F02"/>
</svg>
