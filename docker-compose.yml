services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    ports: ["4021:4021"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 4
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4021}
        NEXT_PUBLIC_MEZO_ADDRESS: ${NEXT_PUBLIC_MEZO_ADDRESS:-}
        NEXT_PUBLIC_DEMO_SPONSOR: "true"
    environment:
      # fallback built-time NEXT_PUBLIC_* live in apps/web/.env.local;
      # runtime override (e.g. hosted API URL) can be set here
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4021}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
